[project]
name = "enterprise-hybrid-rag-workbench"
version = "0.1.0"
description = "Evidence-led Hybrid RAG (SQLite FTS5 BM25 + Dense Bi-Encoder + RRF + Cross-Encoder Reranking), Pre-Retrieval RBAC & Freshness Governance, Passage-Level NLI Claim Verification, and Digest-Bound HITL Workbench"
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Sushant Nemade" }
]
dependencies = [
    "numpy>=2.4,<3",
    "scikit-learn>=1.7,<2",
    "onnx>=1.19,<2",
    "skl2onnx>=1.19,<2",
    "onnxruntime>=1.23,<2",
    "pydantic>=2.14,<3",
    "fastapi>=0.143.3,<0.144",
    "uvicorn>=0.54,<0.55",
]

[project.scripts]
hybrid-rag-eval = "hybrid_rag.evaluate:main"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.15,<1",
    "mypy>=1.19,<2",
    "build>=1.4,<2",
    "pip-audit>=2.10,<3",
    "twine>=6,<7",
    "httpx2>=2.15.1",
]

[build-system]
requires = ["setuptools>=82", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
hybrid_rag = ["py.typed", "models/*", "site/*", "site/data/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 115

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/hybrid_rag"]

[[tool.mypy.overrides]]
module = ["onnx.*", "onnxruntime.*", "sklearn.*", "skl2onnx.*", "sentence_transformers.*"]
ignore_missing_imports = true
